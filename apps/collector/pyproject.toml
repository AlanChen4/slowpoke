[project]
name = "slowpoke-collector"
version = "0.1.0"
description = "Slowpoke's OpenTelemetry gateway on Modal"
requires-python = ">=3.13,<3.14"
dependencies = ["modal==1.5.2"]

[dependency-groups]
dev = ["deptry==0.25.1", "opentelemetry-proto==1.37.0", "pytest==8.4.2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["modal_e2e: requires authenticated Modal CLI"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv]
package = false
