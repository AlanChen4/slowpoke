[project]
name = "slowpoke-backend"
version = "0.1.0"
description = "Slowpoke's OTLP ingestion API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "modal==1.5.2",
  "supabase>=2.18,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "opentelemetry-proto==1.37.0",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "database: requires the isolated local Slowpoke Supabase stack",
  "local_e2e: requires Docker plus authenticated Codex and Claude CLIs",
]
testpaths = ["tests"]

[tool.pyright]
include = ["slowpoke_backend"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"slowpoke_backend/database_types.py" = ["E501", "F401", "UP006", "UP035", "UP040", "UP045"]

[tool.ruff.format]
exclude = ["slowpoke_backend/database_types.py"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
