name: Publish setup package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/workflows/publish-setup.yml"
      - "package.json"
      - "packages/setup/**"
      - "pnpm-lock.yaml"

concurrency:
  group: publish-setup
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slowpokeai/setup test
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          publish-script: pnpm release
          commit-message: "chore(setup): release package"
          pr-title: "chore(setup): release package"
          create-github-releases: true
      - name: Format release pull request
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          gh pr edit "$RELEASE_PR" --body-file - <<'EOF'
          ## Summary

          - Publish the pending Slowpoke setup package changes.

          ## Why

          Package consumers need a versioned release that includes each approved changeset.

          ## Validation

          - `pnpm --filter @slowpokeai/setup test`
          - Changesets version calculation
          EOF
      - name: Check release pull request
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          gh workflow run ci.yml --ref changeset-release/main
          gh workflow run metadata.yml \
            --ref changeset-release/main \
            -f pull_request_number="$RELEASE_PR"
