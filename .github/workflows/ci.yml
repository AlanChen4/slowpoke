name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint JavaScript and TypeScript
        run: pnpm lint:js

      - name: Check JavaScript and TypeScript formatting
        run: pnpm format:js:check

      - name: Find unused JavaScript and TypeScript
        run: pnpm knip

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Test web and tooling
        run: pnpm test --suite setup --suite tooling --suite web

      - name: Check package release notes
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=${{ github.event.pull_request.base.sha }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: apps/backend

      - name: Lint backend
        run: uv run ruff check .
        working-directory: apps/backend

      - name: Check backend formatting
        run: uv run ruff format --check .
        working-directory: apps/backend

      - name: Typecheck backend
        run: uv run pyright
        working-directory: apps/backend

      - name: Find unused backend code
        run: uv run vulture slowpoke_backend tests
        working-directory: apps/backend

      - name: Check backend dependencies
        run: uv run deptry .
        working-directory: apps/backend

      - name: Test backend
        run: uv run pytest -m "not database"
        working-directory: apps/backend

  collector:
    name: Collector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/collector/uv.lock

      - name: Install Collector dependencies
        run: uv sync --locked
        working-directory: apps/collector

      - name: Lint Collector
        run: uv run ruff check .
        working-directory: apps/collector

      - name: Check Collector formatting
        run: uv run ruff format --check .
        working-directory: apps/collector

      - name: Find unused Collector code
        run: uv run vulture collector.py modal_app.py tests
        working-directory: apps/collector

      - name: Check Collector dependencies
        run: uv run deptry .
        working-directory: apps/collector

      - name: Test Collector
        run: uv run pytest
        working-directory: apps/collector

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: apps/backend

      - name: Test database
        run: pnpm test --suite database
