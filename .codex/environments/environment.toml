# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Doppler"

[setup]
script = '''
#!/usr/bin/env bash
set -euo pipefail
{ set +x; } 2>/dev/null || true

PROJECT="web"
CONFIG="dev"
SOURCE_ROOT="${DOPPLER_SOURCE_ROOT:-}"

ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$ROOT"

echo "[setup] Installing dependencies"
pnpm install

get_doppler_token() {
  local scope="$1"
  doppler configure get token --plain --scope "$scope" 2>/dev/null || true
}

try_doppler_token() {
  local label="$1"
  local token="$2"

  if [ -z "$token" ]; then
    return 1
  fi

  if DOPPLER_TOKEN="$token" doppler run --no-fallback --project "$PROJECT" --config "$CONFIG" -- true >/dev/null 2>&1; then
    MY_DOPPLER_TOKEN="$token"
    TOKEN_SOURCE="$label"
    return 0
  fi

  return 1
}

add_scope_candidate() {
  local scope="$1"

  if [ -z "$scope" ] || [ ! -d "$scope" ]; then
    return
  fi

  local existing_scope
  while IFS= read -r existing_scope; do
    if [ "$existing_scope" = "$scope" ]; then
      return
    fi
  done <<< "$SCOPE_CANDIDATES"

  SCOPE_CANDIDATES="${SCOPE_CANDIDATES}${scope}"$'\n'
}

get_worktree_roots() {
  git worktree list --porcelain 2>/dev/null | awk '/^worktree / { print substr($0, 10) }' || true
}

MY_DOPPLER_TOKEN="${DOPPLER_TOKEN:-}"
TOKEN_SOURCE=""
if [ -n "$MY_DOPPLER_TOKEN" ]; then
  try_doppler_token "DOPPLER_TOKEN" "$MY_DOPPLER_TOKEN" || MY_DOPPLER_TOKEN=""
fi

SCOPE_CANDIDATES=""
add_scope_candidate "$SOURCE_ROOT"
while IFS= read -r worktree_root; do
  add_scope_candidate "$worktree_root"
done < <(get_worktree_roots)
add_scope_candidate "$ROOT"

if [ -z "$MY_DOPPLER_TOKEN" ]; then
  while IFS= read -r scope; do
    if [ -z "$scope" ]; then
      continue
    fi
    try_doppler_token "Doppler scope $scope" "$(get_doppler_token "$scope")" && break
  done <<< "$SCOPE_CANDIDATES"
fi
if [ -z "$MY_DOPPLER_TOKEN" ]; then
  try_doppler_token "global Doppler config" "$(doppler configure get token --plain 2>/dev/null || true)" || true
fi

if [ -z "$MY_DOPPLER_TOKEN" ]; then
  echo "No Doppler token found that can read $PROJECT/$CONFIG." >&2
  echo "Run 'doppler setup --project $PROJECT --config $CONFIG --scope \"$ROOT\"', set DOPPLER_SOURCE_ROOT to a checkout already configured for Doppler, or export a valid DOPPLER_TOKEN before retrying." >&2
  exit 1
fi

echo "[setup] Using Doppler credentials from $TOKEN_SOURCE"
echo "[setup] Configuring Doppler scope"
DOPPLER_TOKEN="$MY_DOPPLER_TOKEN" doppler setup \
  --project "$PROJECT" \
  --config "$CONFIG" \
  --no-interactive \
  --scope "$ROOT"

unset MY_DOPPLER_TOKEN TOKEN_SOURCE

doppler run --no-fallback -- true'''
